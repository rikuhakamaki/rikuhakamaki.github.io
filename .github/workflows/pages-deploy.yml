name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Download PDF.js 6.3.289
        env:
          PDFJS_VERSION: "6.3.289"
        run: |
          # Keep the legacy build used by the existing mobile viewer.
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pdfjs.zip" \
            "https://github.com/mozilla/pdf.js/releases/download/v${PDFJS_VERSION}/pdfjs-${PDFJS_VERSION}-legacy-dist.zip"
          echo "51683fac4aff7dd31ed91e9ab735a2098a78d50899d1ec529aed6dc8aa19400d  $RUNNER_TEMP/pdfjs.zip" | sha256sum --check
          mkdir -p "assets/pdfjs/${PDFJS_VERSION}"
          unzip -q "$RUNNER_TEMP/pdfjs.zip" -d "assets/pdfjs/${PDFJS_VERSION}" \
            -x 'build/*.map' 'web/*.map' 'web/compressed.tracemonkey-pldi-09.pdf'
          # Preserve the existing exemption for this link, populated by PDF.js at runtime.
          sed -i 's/<a data-l10n-id="pdfjs-editor-add-signature-image-browse-link"/<a data-proofer-ignore data-l10n-id="pdfjs-editor-add-signature-image-browse-link"/' \
            "assets/pdfjs/${PDFJS_VERSION}/web/viewer.html"

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Verify PDF.js build output
        env:
          SITE_DIR: "_site${{ steps.pages.outputs.base_path }}"
        run: |
          test -s "$SITE_DIR/assets/pdfjs/6.3.289/web/viewer.html"
          test -s "$SITE_DIR/assets/pdfjs/6.3.289/build/pdf.worker.mjs"
          diff --recursive assets/pdfjs/6.3.289 "$SITE_DIR/assets/pdfjs/6.3.289"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
